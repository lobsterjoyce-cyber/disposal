    s+=`<line x1="${cx}" y1="${byy}" x2="${fx+fw/2}" y2="${ftop}" stroke="${FR[dir]}"
        stroke-width="1" stroke-dasharray="3 2" opacity="${on?.8:.4}"/>`;
    s+=`<rect x="${cx-tw/2}" y="${ly}" width="${tw}" height="16" rx="8" fill="${FR[dir]}"
        opacity="${on?1:.62}"/>`;
    s+=`<text x="${cx}" y="${ly+12}" text-anchor="middle" fill="#fff"
        style="font-size:11px;font-weight:600">${sig}</text>`;
  });

  /* 成交量 */
  for(let i=st;i<n;i++){
    const c=k.c[i]>=k.o[i]?UP:DOWN, bh=k.v[i]/vmax*VH;
    s+=`<rect x="${x(i)-CW/2}" y="${vy+VH-bh}" width="${CW}" height="${bh}" fill="${c}" opacity=".55"/>`;
  }
  const step=Math.max(5,Math.round(m/6));
  for(let i=st;i<n;i+=step) s+=`<text x="${x(i)}" y="${vy+VH+13}" text-anchor="middle" class="axis">${DT(k)[i]}</text>`;
  s+=`<text x="${PL+m*BW+5}" y="${vy+11}" class="axis">量</text>`;
  if(big){
    G={st,n,PL,BW,W,PT,PH,vy,VH};
    s+=`<line id="xh" x1="0" y1="${PT-4}" x2="0" y2="${vy+VH+2}" stroke="currentColor"
        stroke-width="1" stroke-dasharray="3 3" opacity="0" pointer-events="none"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}
const chg=k=>{const n=k.c.length,c=k.c[n-1],p=k.c[n-2]||c;return (c-p)/p*100};

/* ---------- 今日訊號 ---------- */
function todayHits(){
  const out=[];
  for(const code in DB){const k=DB[code]; if(k.t<minT)continue;
    (k.m||[]).forEach(m=>{if(m[0]===k.c.length-1)out.push({code,k,sig:m[1],dir:m[2],note:m[4]})})}
  return out;
}
function renderToday(){
  const hits=todayHits(), sigs=[...new Set(hits.map(h=>h.sig))].sort();
  document.getElementById('ctl').innerHTML=
    `<button class="chip ${sigFilter==='*'?'on':''}" data-sig="*">全部型態</button>`+
    sigs.map(s=>`<button class="chip ${sigFilter===s?'on':''}" data-sig="${s}">${s}</button>`).join('')+
    `<span style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <span class="sub">成交金額 ≥</span>
      <select id="mt">${[0,0.5,1,3,10].map(v=>`<option value="${v}" ${v===minT?'selected':''}>${v?v+' 億':'不限'}</option>`).join('')}</select>
    </span>`;
  document.querySelectorAll('#ctl .chip').forEach(b=>b.onclick=()=>{sigFilter=b.dataset.sig;renderToday()});
  const mt=document.getElementById('mt'); if(mt)mt.onchange=()=>{minT=+mt.value;renderToday()};

  const shown=hits.filter(h=>sigFilter==='*'||h.sig===sigFilter);
  document.getElementById('hsub').textContent=`${DAY} ・ 掃描 ${TURN.filter(t=>t>=minT).length} 檔 ・ 命中 ${hits.length} 個訊號`;
  let html="";
  ["BUY","SELL","WATCH"].forEach(d=>{
    const it=shown.filter(h=>h.dir===d).sort((a,b)=>a.sig.localeCompare(b.sig)||a.code.localeCompare(b.code));
    html+=`<section class="grp"><h2>${DIRN[d]} <span class="cnt">${it.length}</span></h2>`;
    if(!it.length)html+='<p class="empty">沒有符合的訊號</p>';
    it.forEach(h=>{const c=h.k.c[h.k.c.length-1],ch=chg(h.k);
      html+=`<article class="card clk" data-code="${h.code}">
        <div class="hd"><span class="tag ${h.dir}">${h.sig}</span><b>${h.code} ${h.k.n}</b>
        <span class="px ${ch>=0?'up':'down'}">${c.toFixed(2)}　${ch>=0?'+':''}${ch.toFixed(2)}%</span></div>
        <div class="note">${h.note}</div>${chart(h.k,null,false)}</article>`});
    html+="</section>";
  });
  document.getElementById('main').innerHTML=html;
  document.querySelectorAll('.card.clk').forEach(c=>c.onclick=()=>{go('find');detail(c.dataset.code)});
}

/* ---------- 個股查詢 ---------- */
function renderFind(){
  document.getElementById('ctl').innerHTML=
    `<div style="position:relative"><input id="q" placeholder="輸入代號或名稱，如 2330" autocomplete="off"></div>
     <span class="sub">最近 60 根日K ・ <span style="color:#f5a623">橘線=20日均線</span> ・ 彩框=近 30 日訊號</span>`;
  bindSearch();
  document.getElementById('hsub').textContent=`${DAY} ・ 收錄 ${LIST.length} 檔上市櫃`;
  if(curCode)detail(curCode); else document.getElementById('main').innerHTML='<p class="empty">請在上方輸入股票代號或名稱。</p>';
}
let curBars=60;
const PERIODS=[["1個月",20],["3個月",60],["半年",120]];

function detail(code,hl){
  const k=DB[code]; curCode=code;
  const el=document.getElementById('main');
  if(!k){el.innerHTML='<p class="empty">查無此代號（可能當日停牌）。</p>';return}
  const n=k.c.length,c=k.c[n-1],ch=chg(k),i=n-1;
  const ms=(k.m||[]).slice().sort((a,b)=>b[0]-a[0]);
  const rows=ms.length?ms.map(m=>`<tr class="r" data-i="${m[0]}"><td>${DT(k)[m[0]]}</td>
    <td><span class="tag ${m[2]}">${m[1]}</span></td><td>${k.c[m[0]].toFixed(2)}</td>
    <td class="sub">${m[4]}</td></tr>`).join('')
    :'<tr><td colspan="4" class="empty">最近 30 個交易日沒有觸發任何訊號</td></tr>';
  const ohlc=infoHTML(k,i), legend=legHTML(k,i);
  const per=PERIODS.filter(p=>p[1]<=n+30).map(([lb,b])=>
    `<button class="pchip ${b===curBars?'on':''}" data-b="${b}">${lb}</button>`).join('');
  el.innerHTML=`<button class="back">← 回今日訊號</button>
    <div class="tt"><b>${code} ${k.n}</b>
    <span class="px ${ch>=0?'up':'down'}">${c.toFixed(2)}　${ch>=0?'+':''}${ch.toFixed(2)}%</span></div>
    <div class="meta">${DT(k)[n-1]}　成交量 ${k.v[i].toLocaleString()} 張　成交金額 ${k.t} 億</div>
    <div class="card">
      <div class="ohlc" id="oh">${ohlc}</div><div class="ohlc leg" id="lg">${legend}</div>
      <div id="cv">${chart(k,hl,true,curBars)}</div>
      <div class="periods">${per}</div>
    </div>
    <h3>近 30 日訊號紀錄（點一列可在圖上標示）</h3>
    <div class="card"><table><tr><th>日期</th><th>訊號</th><th>收盤</th><th>說明</th></tr>${rows}</table></div>`;
  el.querySelectorAll('tr.r').forEach(tr=>tr.onclick=()=>detail(code,+tr.dataset.i));
  el.querySelectorAll('.pchip').forEach(b=>b.onclick=()=>{curBars=+b.dataset.b;detail(code,hl)});
  bindCross(k);
  el.querySelector('.back').onclick=()=>go('today');
  const inp=document.getElementById('q'); if(inp)inp.value=code+' '+k.n;
}
function infoHTML(k,i){
  const p=k.c[i-1], d=p?(k.c[i]-p)/p*100:0, cls=d>=0?'up':'down';
  return `<span>${DT(k)[i]}</span><span>開 ${k.o[i].toFixed(2)}</span>
    <span>高 ${k.h[i].toFixed(2)}</span><span>低 ${k.l[i].toFixed(2)}</span>
    <span>收 <b class="${cls}">${k.c[i].toFixed(2)}</b></span>
    <span class="${cls}">${d>=0?'+':''}${d.toFixed(2)}%</span>
    <span>量 ${k.v[i].toLocaleString()} 張</span>`;
}
function legHTML(k,i){
  return MAS.map(([d,col])=>{const v=ma(k,d,i);
    return v==null?'':`<span style="color:${col}">${d}MA ${v.toFixed(2)}</span>`}).join('');
}
/* 滑鼠／手指移到K線上 → 十字游標 + 顯示當根的股價 */
function bindCross(k){
  const cv=document.getElementById('cv'); if(!cv||!G)return;
  const svg=cv.querySelector('svg'), xh=svg&&svg.querySelector('#xh');
  const oh=document.getElementById('oh'), lg=document.getElementById('lg');
  if(!svg||!xh)return;
  const g=G, last=k.c.length-1;
  const show=cx=>{
    const r=svg.getBoundingClientRect();
    const vx=(cx-r.left)/r.width*g.W;
    let i=Math.round((vx-g.PL-g.BW/2)/g.BW)+g.st;
    i=Math.max(g.st,Math.min(g.n-1,i));
    const x=g.PL+(i-g.st)*g.BW+g.BW/2;
    xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.setAttribute('opacity','.5');
    oh.innerHTML=infoHTML(k,i); lg.innerHTML=legHTML(k,i);
  };
  const reset=()=>{xh.setAttribute('opacity','0');
    oh.innerHTML=infoHTML(k,last); lg.innerHTML=legHTML(k,last)};
  cv.addEventListener('pointermove',e=>{e.preventDefault();show(e.clientX)});
  cv.addEventListener('pointerdown',e=>show(e.clientX));
  cv.addEventListener('pointerleave',reset);
}

function bindSearch(){
  const el=document.getElementById('q'); if(!el)return;
  let box=null,si=-1,cur=[];
  const close=()=>{if(box){box.remove();box=null;si=-1}};
  const pick=i=>{const code=cur[i].split(' ')[0];el.value=cur[i];close();detail(code)};
  el.addEventListener('input',()=>{close();const v=el.value.trim();if(!v)return;
    cur=LIST.filter(x=>x.toLowerCase().includes(v.toLowerCase())).slice(0,40);
    if(!cur.length)return;
    box=document.createElement('div');box.className='sug';
    box.innerHTML=cur.map((x,i)=>`<div data-i="${i}">${x}</div>`).join('');
    el.parentNode.appendChild(box);
    box.querySelectorAll('div').forEach(d=>d.onclick=()=>pick(+d.dataset.i));});
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'){if(box&&si>=0)pick(si);else{const v=el.value.trim().split(' ')[0];
      if(DB[v]){close();detail(v)}else if(cur.length)pick(0)}e.preventDefault();return}
    if(!box)return;const ds=[...box.children];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){si+=e.key==='ArrowDown'?1:-1;si=(si+ds.length)%ds.length;
      ds.forEach(d=>d.classList.remove('sel'));ds[si].classList.add('sel');
      ds[si].scrollIntoView({block:'nearest'});e.preventDefault();}
    else if(e.key==='Escape')close();});
  document.addEventListener('click',e=>{if(!el.parentNode.contains(e.target))close()});
  el.focus();
}

/* ---------- 分頁 ---------- */
function go(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='find'&&!DB_LOADED){loadFullDB().then(renderFind);return}
  v==='today'?renderToday():renderFind();
}
function loadFullDB(){
  document.getElementById('main').innerHTML='<p class="empty">載入完整個股資料中…</p>';
  return new Promise(res=>{const s=document.createElement('script');
    s.src='db.js';
    s.onload=()=>{const F=window.DB_FULL||{};
      for(const c in F){if(DB[c])continue;const k=F[c];
        for(const f of ['o','h','l','c']){const a=k[f];
          for(let i=0;i<a.length;i++)a[i]/=100;}
        DB[c]=k;}
      DB_LOADED=true;res()};
    s.onerror=()=>{DB_LOADED=true;res()};
    document.head.appendChild(s)});
}

/* 手機：型態篩選改用下拉選單（按鈕太多會蓋掉整個畫面） */
const _renderToday=renderToday;
renderToday=function(){_renderToday();mobileFilter();};
function mobileFilter(){
  if(innerWidth>640)return;
  const ctl=document.getElementById('ctl');
  const chips=[...ctl.querySelectorAll('.chip')];
  if(!chips.length)return;
  /* 昨天選的型態今天沒出現時，選單會退回「全部型態」但篩選還卡在舊值，
     畫面就變成一片空白——這裡直接歸位 */
  if(sigFilter!=='*'&&!chips.some(b=>b.dataset.sig===sigFilter)){
    sigFilter='*';renderToday();return;
  }
  const sel=document.createElement('select');
  sel.style.cssText='flex:1;min-width:0';
  chips.forEach(b=>{const o=document.createElement('option');
    o.value=b.dataset.sig;o.textContent=b.textContent;
    if(b.dataset.sig===sigFilter)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>{sigFilter=sel.value;renderToday();window.scrollTo(0,0)};
  chips.forEach(b=>b.remove());
  ctl.insertBefore(sel,ctl.firstChild);
}
addEventListener('resize',()=>{if(view==='today')renderToday()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));
go('today');
</script></body></html>
